# Calradia Unified v0.3.0 - Gameplay is opt-in until verified in Bannerlord v1.5.7.
# Read-only notifications:
EnableSupplyWarnings=true
SupplyWarningDays=3
EnableArmyWarnings=true
EnableNpcAdvisory=true
NpcFoodThreshold=2

# Original player-owned settlement gameplay; turn on after compiling and testing a fresh campaign.
# Adds town/castle menu options to deposit/withdraw vanilla grain in a saved depot ledger.
EnableCivicSystems=false
# Schedules 5-grain transfers between two player-owned depots after 3 days. ABSTRACT, no map party spawned.
EnableAbstractShipments=false
# Spend 300 gold per investment for up to MaxDepotInvestment grain/day in player-owned depot.
EnableEconomy=false
MaxDepotInvestment=3
DepotCapacity=100
# Recruit one local faction basic troop in player-owned settlements for 200 gold.
EnableRecruitment=false
RecruitmentMaxPartySize=100
# v0.10: player-owned fief recruitment, maximum recruits per settlement per day.
LocalRecruitDailyCap=2
# Experimental: pay 250 gold and five depot grain to train two cultural recruits
# in an existing player-owned town/castle garrison (never creates a garrison party).
EnableGarrisonTraining=false
GarrisonTrainingDailyCap=4
GarrisonTrainingMaxTroops=250
# Donate 5 grain to a local notable; increases player relation by 1.
EnableLocalDiplomacy=false

# Existing experimental foraging, from v0.2.0.
EnablePlayerForaging=false
ForageWhenDaysAtMost=2
ForageEveryDays=5
GrainPerForage=2

# v0.4.0: Experimental game-changing systems. Keep false for first startup test.
EnablePhysicalConvoys=false
ConvoyCargoGrain=10
ConvoyGuards=8
MaxActiveConvoys=2
ConvoyTimeoutDays=25
EnableKingdomLevies=false
EnableKingdomDiplomacy=false
KingdomLevyCostGold=250
KingdomLevyCostInfluence=5
KingdomLevyDailyCap=2
DiplomaticMissionCostGold=300
DiplomaticMissionCostInfluence=10
DiplomaticMissionCooldownDays=7

# v0.5.0: Kingdom advisors report priorities only, with zero movement/war/peace side effects.
MaxDailyCouncilReports=3
CouncilPreferredPartySize=45
# Depot purchase costs real player gold, removes saved depot stock, credits vanilla grain.
# Disabled by default until a Windows v1.5.7 build and fresh-save in-game test.
EnableDepotTrade=false

# EXPERIMENTAL. Leave disabled until a v1.5.7 game-referenced C# compile and save/load validation.
EnableAutonomousClanResupply=false
EnableAutonomousClanRecruitTrips=false
# Optional limited strategic patrol; no siege, defense assault or army overriding.
EnableAutonomousClanPatrol=false
AutonomousPatrolMinimumTroops=55
AutonomousLowFoodDays=2
AutonomousRecruitBelow=35
AutonomousMinimumSettlementFood=40
AutonomousCooldownDays=7
AutonomousMaxDailyOrders=2

# v0.11: read-only fiscal briefing for your castle and its bound villages.
# Forecast tax formula uses prosperity and healthy village hearths as estimates.
# It is NOT the native clan finance calculation.
EnableAutoGarrisonWageCaps=false
# Direct castle garrison wage-cap changes can trigger troop desertion if too low.
# No automatic wage cap change during an active siege; never raises manual caps.
EstateTargetDailySurplus=250
EstateOtherCostsReserve=150
EstateMaxDailyGarrisonWage=1800
EstateMinimumDefensiveWage=250
# Real existing garrison: train two cultural recruits only if forecast affordable.
EnableAutoGarrisonTraining=false
EstateTargetGarrisonSize=55
EstateMinimumTrainingGold=5000
# New abstract depot stock from active village hearths, not vanilla village inventory.
EnableVillageHarvest=false
EstateHearthsPerGrain=150
EstateMaxHarvestPerDay=10
# Abstract wholesale sale: consumes saved depot grain and credits denars. No caravan spawned.
EnableSurplusEstateSales=false
EstateGrainReserve=30
EstateMaxDailyGrainSale=8
EstateSalePricePerGrain=18
