      - name: Compile game module against reference assemblies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path BuildResults | Out-Null
          dotnet build Source/CalradiaUnified/CalradiaUnified.csproj --configuration Release --no-restore -p:UsePublicReferences=true -v:normal 2>&1 | Tee-Object -FilePath BuildResults/compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package DLL and runtime files only
        shell: pwsh
        run: ./scripts/Package-Compiled.ps1 -Dll "Source/CalradiaUnified/bin/Release/net472/CalradiaUnified.dll"
      - name: Verify ZIP paths, CRC, DLL identity and hashes
        shell: pwsh
        run: python scripts/verify_package.py Output/CalradiaUnified_v0.38.0_COMPILED_UNTESTED.zip --version v0.38.0
      - name: Test installer with nested GitHub artifact ZIP
        shell: pwsh
        run: |
          $fake = Join-Path (Get-Location) "BuildResults/FakeBannerlord"
          $native = Join-Path $fake "Modules/Native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          '<Module><Id value="Native"/></Module>' | Set-Content -LiteralPath (Join-Path $native "SubModule.xml")
          # Synthetic dependencies for installer contract testing only.
          # Do not interpret these as real BUTR runtime loading.
          foreach ($dependency in @('Bannerlord.Harmony','Bannerlord.ButterLib',
                  'Bannerlord.UIExtenderEx','Bannerlord.MBOptionScreen')) {
            $target = Join-Path $fake ("Modules/" + $dependency)
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            ('<Module><Id value="' + $dependency + '"/></Module>') |
              Set-Content -LiteralPath (Join-Path $target "SubModule.xml")
          }
          $outer = Join-Path (Get-Location) "BuildResults/FakeGitHubDownload.zip"
          Compress-Archive -LiteralPath (Resolve-Path "Output/CalradiaUnified_v0.38.0_COMPILED_UNTESTED.zip").Path -DestinationPath $outer -Force
          ./scripts/Install-CU-From-Artifact.ps1 -GameRoot $fake -ArtifactZip $outer
          $module = Join-Path $fake "Modules/CalradiaUnified"
          if (-not (Test-Path -LiteralPath (Join-Path $module "SubModule.xml"))) { throw "Missing installed manifest" }
          if (-not (Test-Path -LiteralPath (Join-Path $module "bin/Win64_Shipping_Client/CalradiaUnified.dll"))) { throw "Missing installed DLL" }
          ./scripts/Install-CU-From-Artifact.ps1 -GameRoot $fake -ArtifactZip $outer -ReplaceExisting
          if (@(Get-ChildItem -LiteralPath $fake -Directory -Filter "CalradiaUnified_Backup_*").Count -ne 1) { throw "Backup missing" }
          Write-Output "PASS: nested GitHub ZIP installation, correct module root and backup"
          # Missing required dependency must refuse replacement BEFORE
          # moving the existing module or creating another backup.
          $butr = Join-Path $fake "Modules/Bannerlord.ButterLib"
          $disabledButr = Join-Path $fake "ButterLib_InstallerTestDisabled"
          Move-Item -LiteralPath $butr -Destination $disabledButr
          $before = (Get-FileHash -LiteralPath (Join-Path $module "bin/Win64_Shipping_Client/CalradiaUnified.dll") -Algorithm SHA256).Hash
          $backupsBefore = @(Get-ChildItem -LiteralPath $fake -Directory -Filter "CalradiaUnified_Backup_*").Count
          $rejected = $false
          try {
            ./scripts/Install-CU-From-Artifact.ps1 -GameRoot $fake -ArtifactZip $outer -ReplaceExisting
          }
          catch {
            if ($_.Exception.Message -notmatch 'Required BUTR module not installed: Bannerlord.ButterLib') { throw }
            $rejected = $true
          }
          if (-not $rejected) { throw "Installer accepted missing mandatory BUTR." }
          $after = (Get-FileHash -LiteralPath (Join-Path $module "bin/Win64_Shipping_Client/CalradiaUnified.dll") -Algorithm SHA256).Hash
          if ($before -ne $after) { throw "Mandatory dependency failure modified the installed DLL." }
          if (@(Get-ChildItem -LiteralPath $fake -Directory -Filter "CalradiaUnified_Backup_*").Count -ne $backupsBefore) { throw "Rejected dependency changed backups." }
          Move-Item -LiteralPath $disabledButr -Destination $butr
          Write-Output "PASS: required BUTR failure blocks replacement without touching installed files."
      - name: Show latest verified PowerShell installer candidate and fail-closed selection
        shell: pwsh
        run: |
          $listing = @(./scripts/Install-CU-From-Artifact.ps1 -ShowLatest) -join "`n"
          foreach ($required in @(
            'Development version: v0.69g',
            'Windows CI run: 44867186334',
            '8c2382461522907db63d5890e2204864a336e056',
            'd6d9ad9a1ec217d5482a46442597461944c1cf2fa52f185c87309b654dba6f10',
            'Internal Bannerlord manifest version: v0.38.0',
            'game-tested build')) {
            if (-not $listing.Contains($required)) {
              throw "Latest installer listing did not include $required"
            }
          }
          $noArgs = @(./scripts/Install-CU-From-Artifact.ps1) -join "`n"
          if ($noArgs -ne $listing) {
            throw "Installer without arguments must display the latest verified candidate."
          }
          $fake = Join-Path (Get-Location) "BuildResults/FakeBannerlord"
          $outer = Join-Path (Get-Location) "BuildResults/FakeGitHubDownload.zip"
          $dll = Join-Path $fake "Modules/CalradiaUnified/bin/Win64_Shipping_Client/CalradiaUnified.dll"
          $beforeHash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $beforeBackups = @(Get-ChildItem -LiteralPath $fake -Directory -Filter 'CalradiaUnified_Backup_*').Count
          $conflictBlocked = $false
          try {
            ./scripts/Install-CU-From-Artifact.ps1 -GameRoot $fake -ArtifactZip $outer -LatestVerified -ExpectedDllSha256 ('0' * 64) -ReplaceExisting
          } catch {
            $conflictBlocked = $_.Exception.Message -match 'conflicts with the latest pinned CI candidate'
          }
          if (-not $conflictBlocked) { throw 'Conflicting latest selection was not rejected.' }
          if ((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $beforeHash -or
              @(Get-ChildItem -LiteralPath $fake -Directory -Filter 'CalradiaUnified_Backup_*').Count -ne $beforeBackups) {
            throw 'Conflicting latest selection changed an installed DLL or backup.'
          }
          if ($beforeHash -ne '3a890f016bebe9b1a1a6941d09ef98922d479d744187727a812f3a65def83684') {
            $wrongBuildBlocked = $false
            try {
              ./scripts/Install-CU-From-Artifact.ps1 -GameRoot $fake -ArtifactZip $outer -LatestVerified -ReplaceExisting
            } catch {
              $wrongBuildBlocked = $_.Exception.Message -match 'Artifact rejected BEFORE installation'
            }
            if (-not $wrongBuildBlocked) { throw 'Latest verified pin accepted an unrelated compiled DLL.' }
            if ((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $beforeHash -or
                @(Get-ChildItem -LiteralPath $fake -Directory -Filter 'CalradiaUnified_Backup_*').Count -ne $beforeBackups) {
              throw 'Wrong latest artifact changed an installed DLL or backup.'
            }
          }
          Write-Output 'PASS: Latest v0.69g candidate visible, pinned identity and no-modification guard'
      - name: Test pinned CI SHA-256 before install and latest-session playthrough report
        shell: pwsh
        run: |
          $fake = Join-Path (Get-Location) "BuildResults/FakeBannerlord"
          $outer = Join-Path (Get-Location) "BuildResults/FakeGitHubDownload.zip"
          $dll = Join-Path $fake "Modules/CalradiaUnified/bin/Win64_Shipping_Client/CalradiaUnified.dll"
          $hash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $before = @(Get-ChildItem -LiteralPath $fake -Directory -Filter 'CalradiaUnified_Backup_*').Count
          $rejected = $false
          try {
            ./scripts/Install-CU-From-Artifact.ps1 -GameRoot $fake -ArtifactZip $outer -ExpectedVersion 'v0.38.0' -ExpectedDllSha256 ('0' * 64) -ReplaceExisting
          } catch {
            $rejected = $_.Exception.Message -match 'Artifact rejected BEFORE installation'
          }
          if (-not $rejected) { throw 'Installer failed to reject the wrong CI hash.' }
          $after = @(Get-ChildItem -LiteralPath $fake -Directory -Filter 'CalradiaUnified_Backup_*').Count
          if ($after -ne $before -or (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
            throw 'Wrong-hash artifact must never change an installed mod or its backups.'
          }
          ./scripts/Install-CU-From-Artifact.ps1 -GameRoot $fake -ArtifactZip $outer -ExpectedVersion 'v0.38.0' -ExpectedDllSha256 $hash -ReplaceExisting
          $events = Join-Path (Get-Location) 'BuildResults/sample-playthrough-events.csv'
          @(
            'utc,context,detail',
            '2026-11-18T12:00:00Z,sandbox_overhaul_accepted,role=Lord|child_count=2',
            '2026-11-18T12:00:01Z,cu_family_child_created,id=old_child_1|age=5',
            '2026-11-18T13:00:00Z,sandbox_overhaul_accepted,role=Lord|child_count=1',
            '2026-11-18T13:00:01Z,sandbox_creator_family_plan,spouse=True|child_count=1',
            '2026-11-18T13:00:02Z,cu_family_loaded_plan,spouse=True|requested_children=1',
            '2026-11-18T13:00:03Z,cu_family_spouse_created,id=spouse_1|clan=player_faction',
            '2026-11-18T13:00:04Z,cu_family_child_created,id=child_1|age=1',
            '2026-11-18T13:00:05Z,cu_family_verification,result=PASS|requested_children=1|created_children=1',
            '2026-11-18T13:00:06Z,sandbox_start_contract,result=PASS|requested_children=1|children=1',
            '2026-11-18T13:00:07Z,cu_native_review_attached,added_unique_final_stage=true',
            '2026-11-18T13:00:08Z,cu_native_review_view_loaded,native_player_3d=true|native_review_view_reused=true',
            '2026-11-18T13:00:09Z,cu_family_portraits_open,actual_hero_portraits=3|read_only=true'
          ) | Set-Content -LiteralPath $events -Encoding UTF8
          $report = Join-Path (Get-Location) 'BuildResults/sample-playthrough-report.json'
          ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -ExpectedVersion 'v0.38.0' -ExpectedDllSha256 $hash -ExpectedChildren 1 -EventsCsv $events -ExceptionsCsv (Join-Path (Get-Location) 'BuildResults/no-exceptions.csv') -ReportJson $report -Assert
          $r = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($r.status -ne 'PASS' -or $r.child_created_events -ne 1 -or $r.expected_children -ne 1 -or -not $r.ci_hash_pinned) {
            throw 'The current campaign audit did not ignore historical child events.'
          }
          $mismatchWasRejected = $false
          try {
            ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -ExpectedChildren 2 -EventsCsv $events -Assert
          } catch { $mismatchWasRejected = $true }
          if (-not $mismatchWasRejected) { throw 'Expected child mismatch should fail in assertion mode.' }
          ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -ExpectedChildren 1 -RequireNativeReview -ExpectedPortraits 3 -EventsCsv $events -Assert
          $portraitMismatchRejected = $false
          try {
            ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -ExpectedPortraits 4 -EventsCsv $events -Assert
          } catch { $portraitMismatchRejected = $true }
          if (-not $portraitMismatchRejected) { throw 'A fake fourth family portrait must fail.' }
          $nativeMissing = Join-Path (Get-Location) 'BuildResults/sample-native-missing-events.csv'
          @(Get-Content -LiteralPath $events | Where-Object { $_ -notmatch 'cu_native_review_' }) |
              Set-Content -LiteralPath $nativeMissing -Encoding UTF8
          $nativeMismatchRejected = $false
          try {
            ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -RequireNativeReview -EventsCsv $nativeMissing -Assert
          } catch { $nativeMismatchRejected = $true }
          if (-not $nativeMismatchRejected) { throw 'Missing opt-in native 3D stage must fail.' }
          Write-Output 'PASS: pinned CI hash, latest-session one child, exact three Hero portraits, required native stage and negative audit fixtures'
      - name: Regress guided creator session evidence and phase-9 failure detection
        shell: pwsh
        run: |
          $fake = Join-Path (Get-Location) 'BuildResults/FakeBannerlord'
          $events = Join-Path (Get-Location) 'BuildResults/sample-guided-start-failure.csv'
          @(
            'utc,context,detail',
            '2026-11-21T04:23:00Z,sandbox_overhaul_accepted,role=Lord|child_count=1',
            '2026-11-21T04:23:10Z,sandbox_start_contract,result=PASS|requested_children=1|children=1',
            '2026-11-21T04:54:42Z,cu_guided_world_start_committed,role=HouseholdKnight|kingdom=vlandia|scenario=none',
            '2026-11-21T04:55:21Z,cu_guided_house_fortune_committed,age=25|spouse=False|children=0|siblings=0|noble_birth=Independent',
            '2026-11-21T04:55:24Z,cu_native_start_preflight_snapshot,role=HouseholdKnight|expected_type=default|actual_type=unknown|kingdom=none|fiefs=0|ruling=False',
            '2026-11-21T04:55:25Z,cu_starting_life_preflight,result=FAIL|reason=native_start:native_start_type_mismatch|role=HouseholdKnight',
            '2026-11-21T04:55:26Z,sandbox_start_contract,result=FAIL|reason=preflight_native_start:native_start_type_mismatch|no_custom_grants_applied=true'
          ) | Set-Content -LiteralPath $events -Encoding UTF8
          $report = Join-Path (Get-Location) 'BuildResults/sample-guided-failure-report.json'
          ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -ExpectedChildren 0 -EventsCsv $events -ReportJson $report
          $r = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($r.status -ne 'FAIL' -or $r.creator_source -ne 'guided_world' -or
              $r.contract_result -ne 'FAIL' -or $r.expected_children -ne 0 -or
              -not $r.guided_house_committed) {
            throw 'Latest guided failed campaign was masked by earlier legacy PASS.'
          }
          $blocked = $false
          try {
            ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -ExpectedChildren 0 -EventsCsv $events -Assert
          } catch { $blocked = $true }
          if (-not $blocked) { throw 'Guided contract failure must fail assertion.' }
          $eventsIncomplete = Join-Path (Get-Location) 'BuildResults/sample-guided-no-contract.csv'
          @(
            'utc,context,detail',
            '2026-11-21T05:00:00Z,cu_guided_world_start_committed,role=HouseholdKnight|kingdom=vlandia',
            '2026-11-21T05:00:01Z,cu_guided_house_fortune_committed,age=25|children=0|siblings=0'
          ) | Set-Content -LiteralPath $eventsIncomplete -Encoding UTF8
          $reportIncomplete = Join-Path (Get-Location) 'BuildResults/sample-guided-incomplete.json'
          ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -ExpectedChildren 0 -EventsCsv $eventsIncomplete -ReportJson $reportIncomplete
          if ((Get-Content $reportIncomplete -Raw | ConvertFrom-Json).status -ne 'INCOMPLETE') {
            throw 'Missing guided phase-9 contract must not pass.'
          }
          Write-Output 'PASS: latest guided World/House failure and missing-contract sessions are not marked successful'
