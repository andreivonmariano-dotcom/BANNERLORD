name: Calradia Unified 1.5.7 - v0.38.0 native culture and FaceGen bridge
on:
  workflow_dispatch:
  push:
    paths:
      - "Source/**"
      - "Data/**"
      - "verify_source.py"
      - "Tests/**"
      - "Modules/**"
      - "scripts/**"
      - ".github/workflows/bannerlord-build.yml"
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate source and manifest
        shell: pwsh
        run: python verify_source.py
      - name: Verify feature and mod traceability
        shell: pwsh
        run: |
          python scripts/validate_feature_registry.py
          python scripts/test_feature_registry.py
      - name: Validate 78-module reconstruction priorities
        shell: pwsh
        run: python scripts/test_priority_ranking.py
      - name: Audit all 64 settings against source parser ranges
        shell: pwsh
        run: python scripts/validate_settings_catalog.py
      - name: Audit native Gauntlet XML against ViewModel bindings
        shell: pwsh
        run: python scripts/test_gauntlet_bindings.py
      - name: Validate pre-game origin creator XML and ViewModel
        shell: pwsh
        run: python scripts/test_sandbox_origin_panel.py
      - name: Validate direct Sandbox main-menu action and native graph observer
        shell: pwsh
        run: |
          $sub = Get-Content Source/CalradiaUnified/SubModule.cs -Raw
          if ($sub.Contains('CU_Sandbox_Origin')) { throw 'Duplicate custom main menu option still wired' }
          if (-not $sub.Contains('OnBeforeInitialModuleScreenSetAsRoot')) { throw 'Missing direct Sandbox main-menu override hook' }
          $menu = Get-Content Source/CalradiaUnified/SandboxMainMenuEntry.cs -Raw
          if (-not $menu.Contains('SandBoxNewGame') -or -not $menu.Contains('OverrideInitialStateOption')) { throw 'Sandbox main-menu override missing' }
          $behavior = Get-Content Source/CalradiaUnified/SandboxOriginBehavior.cs -Raw
          if (-not $behavior.Contains('OnCharacterCreationInitializedEvent')) { throw 'Native character-creation event hook missing' }
          if (-not $behavior.Contains('cu_native_sandbox_menu')) { throw 'Native creation graph not recorded' }
      - name: Audit native Starting Life links and irreversible hero gates
        shell: pwsh
        run: python scripts/test_native_starting_life.py
      - name: Audit direct Sandbox creator with button brushes and Escape
        shell: pwsh
        run: python scripts/test_sandbox_overhaul.py
      - name: Enforce locked five-page CU Sandbox creation flow
        shell: pwsh
        run: python scripts/test_locked_sandbox_flow.py
      - name: Block unsupported editable fields in CU Sandbox creator
        shell: pwsh
        run: python scripts/test_cu_creator_unavailable_fields.py
      - name: Verify real native starts and post-creation family effects
        shell: pwsh
        run: python scripts/test_native_start_handoff.py
      - name: Audit safe native appearance registration, family eligibility and guided fief choices
        shell: pwsh
        run: python scripts/test_face_fief_creator.py
      - name: Regression check native spouse donors, children and readable UI
        shell: pwsh
        run: python scripts/test_family_templates_readable_ui.py
      - name: Verify generated spouse clan ancestry and parent-blended child appearance
        shell: pwsh
        run: python scripts/test_generated_family.py
      - name: Guard native generated spouse activation and orphan cleanup
        shell: pwsh
        run: python scripts/test_active_generated_marriage.py
      - name: Regress committed child count and native wizard boundary
        shell: pwsh
        run: python scripts/test_child_count_native_wizard.py
      - name: Guard real castle home for spouse and nonactive minor children
        shell: pwsh
        run: python scripts/test_family_home_settlement.py
      - name: Audit opt-in native 3D origin review and actual Hero family portraits
        shell: pwsh
        run: python scripts/test_native_origin_review_and_portraits.py
      - name: Verify real 3D native face composition and seven-stage parity
        shell: pwsh
        run: python scripts/test_native_face_workshop.py
      - name: Check persistent CU native-state culture and face shell pilot
        shell: pwsh
        run: python scripts/test_cu_native_state_shell.py
      - name: Check native-bound CU culture chooser and real 3D face ownership
        shell: pwsh
        run: python scripts/test_cu_native_culture_composition.py
      - name: Audit native-bound CU culture chooser and real FaceGen scene retention
        shell: pwsh
        run: python scripts/test_native_culture_and_face_dock.py
      - name: Lock native five-chapter stage rail and explicit 3D dock capability
        shell: pwsh
        run: python scripts/test_cu_native_five_chapter_rail.py
      - name: Verify fullscreen native-style Sandbox and culture screens
        shell: pwsh
        run: python scripts/test_fullscreen_native_style.py
      - name: Audit responsive full-screen CU and reversible original native FaceGen right dock
        shell: pwsh
        run: python scripts/test_responsive_native_face_trial.py
      - name: Verify new Sandbox auto-attaches the native bridge without experimental toggles
        shell: pwsh
        run: python scripts/test_auto_native_creator_bridge.py
      - name: Check observed start contracts and read-only face-stage integration probe
        shell: pwsh
        run: python scripts/test_unified_creator_contract.py
      - name: Verify runtime evidence analyzer rejects unproven game claims
        shell: pwsh
        run: python scripts/validate_runtime_evidence.py --self-test
      - name: Validate Windows runtime preflight script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/Run-CU-Runtime-Preflight.ps1).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ("PowerShell preflight syntax errors: " + ($parseErrors -join '; ')) }
      - name: Validate standard PowerShell installer and playthrough script syntax
        shell: pwsh
        run: |
          foreach ($script in @('scripts/Install-CU-From-Artifact.ps1','scripts/Test-CU-Playthrough.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ("PowerShell syntax errors in " + $script + ': ' + ($parseErrors -join ', ')) }
          }
      - name: Test diagnostic export reader
        shell: pwsh
        run: python scripts/analyze_diagnostics.py --self-test
      - name: Test Windows diagnostic ZIP exporter
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/Export-CU-Diagnostics.ps1).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ("PowerShell syntax errors: " + ($parseErrors -join '; ')) }
          New-Item -ItemType Directory -Force -Path BuildResults | Out-Null
          ./scripts/Export-CU-Diagnostics.ps1 -OutZip "BuildResults/ci-crash-export.zip" -RecentHours 1
          if (-not (Test-Path "BuildResults/ci-crash-export.zip")) { throw "Diagnostic collector did not produce a ZIP." }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "BuildResults/ci-crash-export.zip").Path)
          try {
            if (-not ($zip.Entries | Where-Object { $_.FullName -eq 'manifest.json' })) {
              throw 'Diagnostic ZIP missing manifest.json'
            }
          } finally { $zip.Dispose() }
      - name: Restore .NET tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path BuildResults | Out-Null
          dotnet restore Tests/PolicySmoke/PolicySmoke.csproj 2>&1 | Tee-Object -FilePath BuildResults/test-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute independent policy tests
        shell: pwsh
        run: |
          dotnet run --project Tests/PolicySmoke/PolicySmoke.csproj --configuration Release --no-restore 2>&1 | Tee-Object -FilePath BuildResults/policy-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Simulate deterministic campaign policies
        shell: pwsh
        run: |
          dotnet run --project Tests/CampaignSimulator/CampaignSimulator.csproj --configuration Release -- --seed 157 --runs 40 --days 365 --json BuildResults/campaign-simulation.json 2>&1 | Tee-Object -FilePath BuildResults/campaign-simulation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore pinned game references from NuGet
        shell: pwsh
        run: |
          dotnet restore Source/CalradiaUnified/CalradiaUnified.csproj -p:UsePublicReferences=true 2>&1 | Tee-Object -FilePath BuildResults/game-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect exact v1.5.7 native character creator API
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/Inspect-CU-Creator-API.ps1).Path,[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ("Native creator audit syntax: " + ($parseErrors -join ', ')) }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Inspect-CU-Creator-API.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile game module against reference assemblies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path BuildResults | Out-Null
          dotnet build Source/CalradiaUnified/CalradiaUnified.csproj --configuration Release --no-restore -p:UsePublicReferences=true -v:normal 2>&1 | Tee-Object -FilePath BuildResults/compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package DLL and runtime files only
        shell: pwsh
        run: ./scripts/Package-Compiled.ps1 -Dll "Source/CalradiaUnified/bin/Release/net472/CalradiaUnified.dll"
      - name: Verify ZIP paths, CRC, DLL identity and hashes
        shell: pwsh
        run: python scripts/verify_package.py Output/CalradiaUnified_v0.38.0_COMPILED_UNTESTED.zip --version v0.38.0
      - name: Test installer with nested GitHub artifact ZIP
        shell: pwsh
        run: |
          $fake = Join-Path (Get-Location) "BuildResults/FakeBannerlord"
          $native = Join-Path $fake "Modules/Native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          '<Module><Id value="Native"/></Module>' | Set-Content -LiteralPath (Join-Path $native "SubModule.xml")
          $outer = Join-Path (Get-Location) "BuildResults/FakeGitHubDownload.zip"
          Compress-Archive -LiteralPath (Resolve-Path "Output/CalradiaUnified_v0.38.0_COMPILED_UNTESTED.zip").Path -DestinationPath $outer -Force
          ./scripts/Install-CU-From-Artifact.ps1 -GameRoot $fake -ArtifactZip $outer
          $module = Join-Path $fake "Modules/CalradiaUnified"
          if (-not (Test-Path -LiteralPath (Join-Path $module "SubModule.xml"))) { throw "Missing installed manifest" }
          if (-not (Test-Path -LiteralPath (Join-Path $module "bin/Win64_Shipping_Client/CalradiaUnified.dll"))) { throw "Missing installed DLL" }
          ./scripts/Install-CU-From-Artifact.ps1 -GameRoot $fake -ArtifactZip $outer -ReplaceExisting
          if (@(Get-ChildItem -LiteralPath $fake -Directory -Filter "CalradiaUnified_Backup_*").Count -ne 1) { throw "Backup missing" }
          Write-Output "PASS: nested GitHub ZIP installation, correct module root and backup"
      - name: Test pinned CI SHA-256 before install and latest-session playthrough report
        shell: pwsh
        run: |
          $fake = Join-Path (Get-Location) "BuildResults/FakeBannerlord"
          $outer = Join-Path (Get-Location) "BuildResults/FakeGitHubDownload.zip"
          $dll = Join-Path $fake "Modules/CalradiaUnified/bin/Win64_Shipping_Client/CalradiaUnified.dll"
          $hash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $before = @(Get-ChildItem -LiteralPath $fake -Directory -Filter 'CalradiaUnified_Backup_*').Count
          $rejected = $false
          try {
            ./scripts/Install-CU-From-Artifact.ps1 -GameRoot $fake -ArtifactZip $outer -ExpectedVersion 'v0.38.0' -ExpectedDllSha256 ('0' * 64) -ReplaceExisting
          } catch {
            $rejected = $_.Exception.Message -match 'Artifact rejected BEFORE installation'
          }
          if (-not $rejected) { throw 'Installer failed to reject the wrong CI hash.' }
          $after = @(Get-ChildItem -LiteralPath $fake -Directory -Filter 'CalradiaUnified_Backup_*').Count
          if ($after -ne $before -or (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
            throw 'Wrong-hash artifact must never change an installed mod or its backups.'
          }
          ./scripts/Install-CU-From-Artifact.ps1 -GameRoot $fake -ArtifactZip $outer -ExpectedVersion 'v0.38.0' -ExpectedDllSha256 $hash -ReplaceExisting
          $events = Join-Path (Get-Location) 'BuildResults/sample-playthrough-events.csv'
          @(
            'utc,context,detail',
            '2026-11-18T12:00:00Z,sandbox_overhaul_accepted,role=Lord|child_count=2',
            '2026-11-18T12:00:01Z,cu_family_child_created,id=old_child_1|age=5',
            '2026-11-18T13:00:00Z,sandbox_overhaul_accepted,role=Lord|child_count=1',
            '2026-11-18T13:00:01Z,sandbox_creator_family_plan,spouse=True|child_count=1',
            '2026-11-18T13:00:02Z,cu_family_loaded_plan,spouse=True|requested_children=1',
            '2026-11-18T13:00:03Z,cu_family_spouse_created,id=spouse_1|clan=player_faction',
            '2026-11-18T13:00:04Z,cu_family_child_created,id=child_1|age=1',
            '2026-11-18T13:00:05Z,cu_family_verification,result=PASS|requested_children=1|created_children=1',
            '2026-11-18T13:00:06Z,sandbox_start_contract,result=PASS|requested_children=1|children=1',
            '2026-11-18T13:00:07Z,cu_native_review_attached,added_unique_final_stage=true',
            '2026-11-18T13:00:08Z,cu_native_review_view_loaded,native_player_3d=true|native_review_view_reused=true',
            '2026-11-18T13:00:09Z,cu_family_portraits_open,actual_hero_portraits=3|read_only=true'
          ) | Set-Content -LiteralPath $events -Encoding UTF8
          $report = Join-Path (Get-Location) 'BuildResults/sample-playthrough-report.json'
          ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -ExpectedVersion 'v0.38.0' -ExpectedDllSha256 $hash -ExpectedChildren 1 -EventsCsv $events -ExceptionsCsv (Join-Path (Get-Location) 'BuildResults/no-exceptions.csv') -ReportJson $report -Assert
          $r = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($r.status -ne 'PASS' -or $r.child_created_events -ne 1 -or $r.expected_children -ne 1 -or -not $r.ci_hash_pinned) {
            throw 'The current campaign audit did not ignore historical child events.'
          }
          $mismatchWasRejected = $false
          try {
            ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -ExpectedChildren 2 -EventsCsv $events -Assert
          } catch { $mismatchWasRejected = $true }
          if (-not $mismatchWasRejected) { throw 'Expected child mismatch should fail in assertion mode.' }
          ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -ExpectedChildren 1 -RequireNativeReview -ExpectedPortraits 3 -EventsCsv $events -Assert
          $portraitMismatchRejected = $false
          try {
            ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -ExpectedPortraits 4 -EventsCsv $events -Assert
          } catch { $portraitMismatchRejected = $true }
          if (-not $portraitMismatchRejected) { throw 'A fake fourth family portrait must fail.' }
          $nativeMissing = Join-Path (Get-Location) 'BuildResults/sample-native-missing-events.csv'
          @(Get-Content -LiteralPath $events | Where-Object { $_ -notmatch 'cu_native_review_' }) |
              Set-Content -LiteralPath $nativeMissing -Encoding UTF8
          $nativeMismatchRejected = $false
          try {
            ./scripts/Test-CU-Playthrough.ps1 -GameRoot $fake -RequireNativeReview -EventsCsv $nativeMissing -Assert
          } catch { $nativeMismatchRejected = $true }
          if (-not $nativeMismatchRejected) { throw 'Missing opt-in native 3D stage must fail.' }
          Write-Output 'PASS: pinned CI hash, latest-session one child, exact three Hero portraits, required native stage and negative audit fixtures'
      - name: Upload untested paste-ready compiled candidate
        uses: actions/upload-artifact@v4
        with:
          name: CalradiaUnified-v0.38.0-compiled-untested
          path: Output/CalradiaUnified_v0.38.0_COMPILED_UNTESTED.zip
          if-no-files-found: error
      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CalradiaUnified-v0.38.0-simulation-report
          path: |
            BuildResults/campaign-simulation.json
            BuildResults/campaign-simulation.log
          if-no-files-found: ignore
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CalradiaUnified-v0.38.0-build-errors
          path: BuildResults/*.log
          if-no-files-found: ignore

      - name: Upload native creator API metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CalradiaUnified-v0.30-native-creator-api-audit
          path: BuildResults/character-creation-api-v157.txt
          if-no-files-found: warn
