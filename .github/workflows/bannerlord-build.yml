            (Resolve-Path -LiteralPath scripts/Install-CU-UI-SpriteSources.ps1).Path,
            [ref]$tokens,[ref]$issues)
          if($issues.Count -gt 0) {
            $issues | ForEach-Object { Write-Error $_.Message }
            throw 'UI atlas installer PowerShell parser failed.'
