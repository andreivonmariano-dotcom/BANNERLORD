name: Calradia Unified 1.5.7 - v0.12.0 exportable finance and crash diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - "Source/**"
      - "Data/**"
      - "verify_source.py"
      - "Tests/**"
      - "Modules/**"
      - "scripts/**"
      - ".github/workflows/bannerlord-build.yml"
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate source and manifest
        shell: pwsh
        run: python verify_source.py
      - name: Verify feature and mod traceability
        shell: pwsh
        run: |
          python scripts/validate_feature_registry.py
          python scripts/test_feature_registry.py
      - name: Test diagnostic export reader
        shell: pwsh
        run: python scripts/analyze_diagnostics.py --self-test
      - name: Test Windows diagnostic ZIP exporter
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/Export-CU-Diagnostics.ps1).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ("PowerShell syntax errors: " + ($parseErrors -join '; ')) }
          New-Item -ItemType Directory -Force -Path BuildResults | Out-Null
          ./scripts/Export-CU-Diagnostics.ps1 -OutZip "BuildResults/ci-crash-export.zip" -RecentHours 1
          if (-not (Test-Path "BuildResults/ci-crash-export.zip")) { throw "Diagnostic collector did not produce a ZIP." }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "BuildResults/ci-crash-export.zip").Path)
          try {
            if (-not ($zip.Entries | Where-Object { $_.FullName -eq 'manifest.json' })) {
              throw 'Diagnostic ZIP missing manifest.json'
            }
          } finally { $zip.Dispose() }
      - name: Restore .NET tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path BuildResults | Out-Null
          dotnet restore Tests/PolicySmoke/PolicySmoke.csproj 2>&1 | Tee-Object -FilePath BuildResults/test-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute independent policy tests
        shell: pwsh
        run: |
          dotnet run --project Tests/PolicySmoke/PolicySmoke.csproj --configuration Release --no-restore 2>&1 | Tee-Object -FilePath BuildResults/policy-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Simulate deterministic campaign policies
        shell: pwsh
        run: |
          dotnet run --project Tests/CampaignSimulator/CampaignSimulator.csproj --configuration Release -- --seed 157 --runs 40 --days 365 --json BuildResults/campaign-simulation.json 2>&1 | Tee-Object -FilePath BuildResults/campaign-simulation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore pinned game references from NuGet
        shell: pwsh
        run: |
          dotnet restore Source/CalradiaUnified/CalradiaUnified.csproj -p:UsePublicReferences=true 2>&1 | Tee-Object -FilePath BuildResults/game-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile game module against reference assemblies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path BuildResults | Out-Null
          dotnet build Source/CalradiaUnified/CalradiaUnified.csproj --configuration Release --no-restore -p:UsePublicReferences=true -v:normal 2>&1 | Tee-Object -FilePath BuildResults/compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package DLL and runtime files only
        shell: pwsh
        run: ./scripts/Package-Compiled.ps1 -Dll "Source/CalradiaUnified/bin/Release/net472/CalradiaUnified.dll"
      - name: Upload untested paste-ready compiled candidate
        uses: actions/upload-artifact@v4
        with:
          name: CalradiaUnified-v0.12.0-compiled-untested
          path: Output/CalradiaUnified_v0.12.0_COMPILED_UNTESTED.zip
          if-no-files-found: error
      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CalradiaUnified-v0.12.0-simulation-report
          path: |
            BuildResults/campaign-simulation.json
            BuildResults/campaign-simulation.log
          if-no-files-found: ignore
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CalradiaUnified-v0.12.0-build-errors
          path: BuildResults/*.log
          if-no-files-found: ignore
